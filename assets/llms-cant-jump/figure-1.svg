<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="Mock diagram: interpolation inside the training manifold versus a jump outside it">
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
    <!-- training manifold -->
    <rect x="30" y="40" width="330" height="160" rx="16" fill="none" stroke="#8b95a1" stroke-width="1.5"/>
    <text x="48" y="68" fill="#78828e">training manifold</text>

    <!-- seen trajectories -->
    <path d="M60 160 C 110 120, 150 180, 200 140 S 300 110, 340 130" fill="none" stroke="#7aa2f7" stroke-width="2"/>
    <path d="M60 120 C 120 90, 180 140, 240 110 S 320 80, 340 95" fill="none" stroke="#7aa2f7" stroke-width="2" opacity="0.55"/>
    <circle cx="200" cy="140" r="4" fill="#7aa2f7"/>
    <text x="120" y="196" fill="#78828e">interpolation ✓</text>

    <!-- jump -->
    <path d="M345 128 C 420 90, 470 90, 520 118" fill="none" stroke="#c46a6a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="400" y="78" fill="#c46a6a">jump ✗</text>

    <!-- target state -->
    <circle cx="530" cy="124" r="6" fill="none" stroke="#c46a6a" stroke-width="2"/>
    <text x="488" y="156" fill="#78828e">s</text>
    <text x="496" y="161" fill="#78828e" font-size="10">t+1</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c46a6a"/>
    </marker>
  </defs>
</svg>
